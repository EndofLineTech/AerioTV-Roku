name: Bug report
description: Report a problem with AerioTV for Roku.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AerioTV **for Roku**. Please check [existing issues](https://github.com/EndofLineTech/AerioTV-Roku/issues) first. Never post passwords, API keys, session tokens or provider URLs, including in screenshots or logs.
  - type: input
    id: release
    attributes:
      label: AerioTV release
      description: Find this in the release ZIP name or the app's version information.
      placeholder: e.g. v0.3.82
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Roku model and OS version
      placeholder: e.g. Streaming Stick 4K (3820RW2), Roku OS 15.3.4
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Connection type
      options:
        - Dispatcharr
        - Direct M3U / XMLTV
        - Direct Xtream
        - Not connected / unsure
    validations:
      required: true
  - type: input
    id: dispatcharr-version
    attributes:
      label: Dispatcharr version (if applicable)
      placeholder: e.g. 0.31.0
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen and Roku remote actions that lead to the problem.
      placeholder: |
        1. Open...
        2. Press...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error text if available.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Photos or additional details
      description: Drag in a photo or add sanitized diagnostics if helpful. Remove passwords, API keys, session tokens and provider URLs first.
    validations:
      required: false
